blocked_by = ["supfork"]
title = "M3 supervisor: backoff and restart-storm guard"
body = '''
**The subtle part.** A physically unplugged sensor is NOT a crash. Restarting a
child in a tight loop because its hardware is gone is a restart storm, and it is
the failure most likely to appear at hour 31 of the soak.

Distinguish 'crashed' from 'absent' and log the distinction.
'''

[[item]]
slug = "led"
milestone = "M3"
labels = ["task"]
decision = "D-014"
blocked_by = ["supfork"]
title = "M3 supervisor: drive the warning light from child health and verdicts"
body = '''
D-014. The supervisor is the only writer of GPIO17. Every live state blinks:
slow = on duty, double-blink = a verdict surfaced, fast = degraded. A steady light,
on or off, must only ever mean "not running".

The blink timer must never delay waitpid handling — fold it into the supervisor's
existing event loop, do not add a thread.

Test: kill -9 the supervisor and confirm the light freezes steady; kill -9
analyzed and confirm it goes to fast blink, not a stale verdict.
'''

