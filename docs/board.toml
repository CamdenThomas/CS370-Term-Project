body = '''
Camden's memo (PROBLEM.md, risk): a car cannot run for 48 hours, so something must
answer Mode 01 requests continuously for soak rehearsal and testing.

tools/obdsim.py opens a pseudo-terminal and answers AT and Mode 01 requests the way
the adapter does, from recorded live captures (`firstcap`) at real or accelerated
speed. The capture daemon opens it exactly like /dev/obd, so the real pipeline runs
unmodified. **Everything it produces is `src=synth`** — CLAUDE.md §2.7, no exceptions.

**Training caution.** A model trained on the fake port learns our generator, not the
car. Train on labeled live captures and induced faults; use synth only where it is
labeled as such in the evaluation (handout §5: ten labeled recordings you made beat
ten thousand samples you did not).

A hardware OBD2 simulator board, which would exercise the real adapter and USB path,
is optional — only if D-006 requires the soak to include them.
'''

