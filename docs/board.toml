[[item]]
slug = "pisensor"
milestone = "M2"
labels = ["decision", "critical-path"]
owner = "camden"
decision = "D-017"
blocked_by = ["order"]
title = "M2 decision: add a sensor on the Pi itself — MPU-6050, DS18B20, both, or neither?"
body = '''
With the USB OBD2 adapter (D-015) as the only data source, three things weaken at once:

1. **Mechanisms.** Only D and E stand (D-017). Two is the floor, with nothing in reserve.
2. **Handout §3.1, two physically distinct sensors.** The car's sensors are distinct, but
   all arrive through one USB device at one rate — a grader may call that one sensor.
3. **The soak.** "The 48-hour soak runs on live sensors" (handout §5); a parked car on a
   fake OBD2 port is not live (D-006, `soakq`).

Options:
- **MPU-6050** ($4, I2C, INT pin, kHz FIFO): restores B and F, gives the soak a live
  high-rate sensor, adds vibration the ECU cannot see.
- **DS18B20** ($4, 1-Wire, kernel driver): an ambient/under-hood temperature the cooling
  diagnostic (#2) gates on, and a live soak sensor — but restores neither B nor F.
- **Both** ($8). **Neither**: D + E only, and accept the §3.1 and soak risk.

**Recommendation: both.** Cheapest insurance in the project.

**Answer that unblocks it:** one word — MPU-6050 / DS18B20 / both / neither. If yes,
add the part to the order; `canirq`, `canpoll`, `expirq` and `expdrop` follow the answer.
'''

