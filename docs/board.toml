body = '''
**Done.** Verified 2026-09-12.

Labels, milestones, issues and the project board are generated by
`python tools/board_sync.py` from docs/board.toml — see docs/BOARD.md.

The `Main` ruleset is active on the default branch with no bypass actors, and now
matches CLAUDE.md 7.10 exactly:

| Setting | State |
|---|---|
| Require a pull request before merging | on |
| Required approving reviews | 1 |
| Dismiss stale approvals on push | on |
| Require conversation resolution | on |
| Block force pushes (non-fast-forward) | on |
| Block deletions | on |
| Allowed merge methods | **merge only** |

Merge-only is the one worth restating: our granular history IS the graded deliverable
(7.9), and one squash-merge of a ten-commit PR would delete ten commits of evidence
permanently.

CI added alongside this: `.github/workflows/board.yml` fails a build when GitHub has
drifted from docs/board.toml, and `make test` validates the manifest itself.
'''

